name: Vertice Music Pipeline

on:
  workflow_dispatch:
    inputs:
      descompilar_apk:
        description: "Descompilar APK após o build? (true/false)"
        required: false
        default: "false"
      salvar_no_repo:
        description: "Salvar alterações no repositório? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  run-all:
    name: Build e Descompilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Extrair ZIP se existir e achar pubspec.yaml
        run: |
          if [ ! -f "pubspec.yaml" ] && [ ! -f "vertice_music/pubspec.yaml" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p /tmp/zip_staging
              unzip -q "$ZIP_FILE" -d /tmp/zip_staging
              TOP_ENTRIES=$(ls -A /tmp/zip_staging | wc -l)
              FIRST_ENTRY=$(ls -A /tmp/zip_staging | head -n 1)
              if [ "$TOP_ENTRIES" -eq 1 ] && [ -d "/tmp/zip_staging/$FIRST_ENTRY" ]; then
                cp -rf "/tmp/zip_staging/$FIRST_ENTRY/." .
              else
                cp -rf /tmp/zip_staging/. .
              fi
              rm -f "$ZIP_FILE"
            fi
          fi

          FOUND_PUBSPEC=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$FOUND_PUBSPEC" ]; then
            echo "pubspec.yaml nao encontrado"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND_PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 3. Ajustar NDK no build.gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "ndkVersion" "$BUILD_GRADLE"; then
              sed -i 's/ndkVersion.*/ndkVersion = "25.1.8937393"/' "$BUILD_GRADLE"
            else
              sed -i 's/android {/android {\n        ndkVersion = "25.1.8937393"/' "$BUILD_GRADLE"
            fi
          fi

      - name: 4. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 5. Configurar Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: 6. Baixar pacotes Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: 7. Corrigir withValues e providers
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find lib -name "*.dart" -exec perl -i -pe 's/\.withValues\(\s*alpha:\s*([^)]+)\)/.withOpacity($1)/g' {} +

          CONTROLLER_FILE="lib/core/app_controller.dart"
          if [ -f "$CONTROLLER_FILE" ] && ! grep -qE "get providers\b|providers\s*=" "$CONTROLLER_FILE"; then
            python3 - <<'EOF'
from pathlib import Path
p = Path("lib/core/app_controller.dart")
text = p.read_text(encoding="utf-8")
idx = text.rfind("}")
if idx != -1:
    injection = "\n  List<dynamic> get providers => const [];\n"
    p.write_text(text[:idx] + injection + text[idx:], encoding="utf-8")
EOF
          fi

      - name: 8. Compilar APK release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: 9. Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vertice-music-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 10. Descompilar APK (Apktool + JADX)
        if: ${{ github.event.inputs.descompilar_apk == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p /tmp/decompile_tools decompiled_output/apktool decompiled_output/jadx
          curl -L --fail "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o /tmp/decompile_tools/apktool.jar
          curl -L --fail "https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip" -o /tmp/decompile_tools/jadx.zip
          unzip -q /tmp/decompile_tools/jadx.zip -d /tmp/decompile_tools/jadx
          chmod +x /tmp/decompile_tools/jadx/bin/jadx

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          java -jar /tmp/decompile_tools/apktool.jar d -f "$APK_PATH" -o decompiled_output/apktool || true
          /tmp/decompile_tools/jadx/bin/jadx -d decompiled_output/jadx "$APK_PATH" || true

      - name: 11. Enviar artefato descompilado
        if: ${{ github.event.inputs.descompilar_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vertice-music-decompiled
          path: ${{ env.PROJECT_DIR }}/decompiled_output/
          retention-days: 14

      - name: 12. Salvar no repositório
        if: ${{ github.event.inputs.salvar_no_repo == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualiza build e descompilacao [skip ci]"
            git push || true
          fi
