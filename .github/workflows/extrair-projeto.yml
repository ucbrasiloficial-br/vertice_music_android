
name: Extrair Projeto VERTICE MUSIC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar ZIP
        id: zip
        run: |
          if [ ! -f "vertice_music_catalogo_aberto.zip" ]; then
            echo "Arquivo vertice_music_catalogo_aberto.zip não encontrado na raiz."
            exit 1
          fi

      - name: Extrair arquivos
        run: |
          mkdir -p "$RUNNER_TEMP/projeto"
          unzip -o vertice_music_catalogo_aberto.zip -d "$RUNNER_TEMP/projeto"

          if [ ! -d "$RUNNER_TEMP/projeto/vertice_music" ]; then
            echo "Pasta vertice_music não encontrada dentro do ZIP."
            exit 1
          fi

          mkdir -p vertice_music
          cp -a "$RUNNER_TEMP/projeto/vertice_music/." vertice_music/

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vertice_music

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Atualiza VERTICE MUSIC com catálogo aberto"
            git push
          fi
