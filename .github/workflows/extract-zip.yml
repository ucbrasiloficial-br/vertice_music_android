name: Descompactar ZIP na Raiz e Compilar APK

on:
  workflow_dispatch:
    inputs:
      apagar_zip_depois:
        description: "Apagar o arquivo .zip após descompactar? (true/false)"
        required: false
        default: "true"
      compilar_apk:
        description: "Compilar o APK logo após extrair? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  extract-and-build:
    name: Descompactar ZIP & Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o repositório
        uses: actions/checkout@v4

      - name: 2. Encontrar o arquivo .zip na raiz
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo .zip encontrado na raiz do repositório."
            ls -la
            exit 1
          fi
          echo "Arquivo ZIP encontrado: $ZIP_FILE"
          mkdir -p /tmp/zip_work
          cp "$ZIP_FILE" /tmp/zip_work/source.zip
          echo "ORIGINAL_ZIP=$ZIP_FILE" >> $GITHUB_ENV

      - name: 3. Extrair conteúdo direto na raiz do repositório
        run: |
          mkdir -p /tmp/zip_staging
          unzip -q /tmp/zip_work/source.zip -d /tmp/zip_staging

          # Se houver apenas uma pasta dentro do ZIP (ex: vertice_music/), move o conteúdo dela para a raiz
          TOP_ENTRIES=$(ls -A /tmp/zip_staging | wc -l)
          FIRST_ENTRY=$(ls -A /tmp/zip_staging | head -n 1)
          if [ "$TOP_ENTRIES" -eq 1 ] && [ -d "/tmp/zip_staging/$FIRST_ENTRY" ]; then
            echo "Movendo arquivos de '$FIRST_ENTRY/' para a raiz..."
            cp -rf "/tmp/zip_staging/$FIRST_ENTRY/." .
          else
            cp -rf /tmp/zip_staging/. .
          fi

          if [ "${{ github.event.inputs.apagar_zip_depois }}" == "true" ]; then
            rm -f "$ORIGINAL_ZIP"
          fi

          ls -la

      - name: 4. Salvar arquivos descompactados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: descompacta projeto Flutter na raiz do repositório" || echo "Nada para commitar"
          git push

      - name: 5. Configurar Java (JDK 17)
        if: ${{ github.event.inputs.compilar_apk == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 6. Configurar Flutter
        if: ${{ github.event.inputs.compilar_apk == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: 7. Instalar dependências e compilar APK
        if: ${{ github.event.inputs.compilar_apk == 'true' }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: 8. Disponibilizar APK para download
        if: ${{ github.event.inputs.compilar_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vertice-music-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          
