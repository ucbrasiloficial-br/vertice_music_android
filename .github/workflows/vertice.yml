
name: Vertice Music - Extrair e Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair projeto ZIP para a raiz
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="vertice_music_catalogo_aberto.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: $ZIP_FILE não encontrado na raiz do repositório."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          PUBSPEC="$(find "$TEMP_DIR" -type f -name pubspec.yaml | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Projeto encontrado em: $PROJECT_DIR"

          # Remove a antiga estrutura em subpasta.
          rm -rf vertice_music

          # Copia o projeto diretamente para a raiz.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='vertice_music_catalogo_aberto.zip' \
            "$PROJECT_DIR/" ./

          rm -rf "$TEMP_DIR"

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERRO: projeto não foi extraído corretamente."
            exit 1
          fi

          echo "Extração concluída."

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Ajustar NDK e Kotlin
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/ndkVersion.*/ndkVersion = "25.1.8937393"/' android/app/build.gradle || true
          fi

          for f in android/settings.gradle android/settings.gradle.kts android/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/(org\.jetbrains\.kotlin\.android["'\'']?\s*version\s*["'\'']?)[0-9]+\.[0-9]+\.[0-9]+/\12.1.0/g' "$f" || true
              sed -i -E 's/(ext\.kotlin_version\s*=\s*["'\''])[0-9]+\.[0-9]+\.[0-9]+/\12.1.0/g' "$f" || true
              sed -i -E 's/(kotlin_version\s*=\s*["'\''])[0-9]+\.[0-9]+\.[0-9]+/\12.1.0/g' "$f" || true
            fi
          done

      - name: Compatibilidade Flutter
        run: |
          find lib -name "*.dart" -exec sed -i 's/\.withValues(alpha:/.withOpacity(/g' {} +

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze --no-pub

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VERTICE-MUSIC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar projeto extraído no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git rm --cached --ignore-unmatch vertice_music_catalogo_aberto.zip || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualiza VERTICE MUSIC na raiz e prepara APK"
            git push
          fi
