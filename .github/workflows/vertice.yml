name: Vertice Music Build

on:
  workflow_dispatch:
    inputs:
      descompilar:
        description: "Descompilar APK apos o build? (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertice_music

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable

      - name: Ajustar NDK
        run: sed -i 's/ndkVersion.*/ndkVersion = "25.1.8937393"/' android/app/build.gradle || true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Corrigir withValues e providers
        run: find lib -name "*.dart" -exec sed -i 's/\.withValues(alpha:/.withOpacity(/g' {} +

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vertice-music-apk
          path: vertice_music/build/app/outputs/flutter-apk/app-release.apk
