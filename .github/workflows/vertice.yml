name: Vertice Music Build

on:
  workflow_dispatch:
    inputs:
      descompilar:
        description: "Descompilar APK apos o build? (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vertice_music

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable

      - name: Ajustar NDK
        run: sed -i 's/ndkVersion.*/ndkVersion = "25.1.8937393"/' android/app/build.gradle || true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Corrigir withValues e providers
        run: |
          find lib -name "*.dart" -exec sed -i 's/\.withValues(alpha:/.withOpacity(/g' {} +
          python3 -c 'from pathlib import Path; p = Path("lib/core/app_controller.dart"); s = p.read_text(); i = s.rfind("}"); p.write_text(s[:i] + "\n  List<dynamic> get providers => const [];\n" + s[i:]) if i != -1 and "get providers" not in s else None'

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vertice-music-apk
          path: vertice_music/build/app/outputs/flutter-apk/app-release.apk
