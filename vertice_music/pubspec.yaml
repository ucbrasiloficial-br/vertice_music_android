name: vertice_music
description: "VÉRTICE MUSIC — Sua música. Seu universo. Aplicativo Android de streaming musical em Flutter/Dart com fontes abertas e licenciadas."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
